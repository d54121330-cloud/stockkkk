<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股投信機構精準決策終端 | Apple Cupertino Glassmorphism</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ECharts 5.x CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
/* Apple Cupertino Dark Glassmorphism Design System */
:root {
  --bg-dark: #000000;
  --bg-card: rgba(22, 24, 34, 0.72);
  --bg-subtle: rgba(255, 255, 255, 0.05);
  --bg-modal: #0c0d14;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;

  --accent-gold: #f59e0b;
  --accent-gold-light: #fbbf24;
  --accent-cyan: #38bdf8;
  --accent-green: #34d399;
  --accent-rose: #fb7185;
  --accent-purple: #c084fc;

  --border-subtle: rgba(255, 255, 255, 0.12);
  --border-highlight: rgba(245, 158, 11, 0.4);

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --transition-smooth: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.07) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.07) 0%, transparent 40%);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.5;
  font-size: 13.5px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: var(--font-mono); }
.font-bold { font-weight: 700; }
.text-green { color: var(--accent-green) !important; }
.text-cyan { color: var(--accent-cyan) !important; }
.text-amber { color: var(--accent-gold-light) !important; }
.text-rose { color: var(--accent-rose) !important; }
.text-muted { color: var(--text-muted) !important; }
.text-xs { font-size: 11px; }

/* Apple Cupertino Header */
.terminal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 40px;
  background: rgba(10, 11, 16, 0.75);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(25px) saturate(180%);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-badge {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #000;
  font-weight: 900;
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 3px 10px;
  border-radius: 100px;
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
}

.header-brand h1 {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
  background: linear-gradient(90deg, #ffffff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-status-group {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent-green);
  background: rgba(52, 211, 153, 0.1);
  padding: 5px 14px;
  border-radius: 100px;
  border: 1px solid rgba(52, 211, 153, 0.2);
}

.status-dot {
  width: 7px; height: 7px;
  background: var(--accent-green);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent-green);
}

.manual-refresh-btn {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 14px;
  border-radius: 100px;
  cursor: pointer;
  transition: var(--transition-smooth);
}
.manual-refresh-btn:hover {
  background: var(--accent-gold);
  color: #000;
  font-weight: bold;
}

/* Apple Style Ticker Carousel Bar */
.ticker-carousel-bar {
  display: flex;
  gap: 12px;
  padding: 10px 40px;
  overflow-x: auto;
  background: rgba(255, 255, 255, 0.02);
  border-bottom: 1px solid var(--border-subtle);
  scrollbar-width: none;
}
.ticker-carousel-bar::-webkit-scrollbar { display: none; }

.ticker-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  padding: 4px 12px;
  border-radius: 100px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 11.5px;
  transition: var(--transition-smooth);
}
.ticker-chip:hover, .ticker-chip.active {
  background: rgba(245, 158, 11, 0.15);
  border-color: var(--accent-gold);
}
.ticker-sym { font-weight: 800; color: var(--accent-gold); font-family: var(--font-mono); }
.ticker-name { color: var(--text-primary); font-weight: 600; }

/* Dashboard Container */
.dashboard-container {
  max-width: 1650px;
  margin: 0 auto;
  padding: 24px 40px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Glassmorphic Cards */
.glass-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  padding: 18px 22px;
  backdrop-filter: blur(25px) saturate(180%);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}

/* Apple Segmented Controls */
.filter-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.filter-controls {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.filter-group label {
  color: var(--text-muted);
  font-weight: 600;
  font-size: 11.5px;
  font-family: var(--font-mono);
}

.segmented-control {
  display: flex;
  background: rgba(255, 255, 255, 0.05);
  padding: 3px;
  border-radius: 100px;
  gap: 2px;
  border: 1px solid var(--border-subtle);
}

.filter-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 100px;
  cursor: pointer;
  transition: var(--transition-smooth);
}
.filter-btn:hover { color: var(--text-primary); }
.filter-btn.active {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #000000;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
}

.star-filter-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 11.5px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 100px;
  cursor: pointer;
  transition: var(--transition-smooth);
}
.star-filter-btn.active {
  background: rgba(245, 158, 11, 0.2);
  color: var(--accent-gold);
  border-color: var(--accent-gold);
}

.search-box {
  position: relative;
  width: 240px;
}
.search-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  border-radius: 100px;
  padding: 7px 14px 7px 34px;
  color: var(--text-primary);
  font-size: 12px;
  font-family: var(--font-sans);
  outline: none;
  transition: var(--transition-smooth);
}
.search-input:focus { border-color: var(--accent-gold); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 12px;
}

/* Screener Sliders Bar */
.screener-bar {
  display: flex;
  gap: 24px;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
  margin-top: 10px;
  flex-wrap: wrap;
}
.screener-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  color: var(--text-secondary);
}
.screener-item input[type=range] {
  accent-color: var(--accent-gold);
}

/* Master Decision Table */
.table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  overflow-x: auto;
  backdrop-filter: blur(25px) saturate(180%);
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

.master-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.master-table th {
  background: rgba(12, 13, 20, 0.9);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}

.master-table td {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  vertical-align: middle;
}

.master-table-row {
  cursor: pointer;
  transition: var(--transition-smooth);
}
.master-table-row:hover, .master-table-row.selected-row {
  background: rgba(245, 158, 11, 0.12);
}

.star-btn {
  background: transparent;
  border: none;
  font-size: 16px;
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition-smooth);
}
.star-btn.starred, .star-btn:hover { color: var(--accent-gold); }

.symbol-code {
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 14px;
  color: var(--accent-gold);
}
.stock-title-name {
  font-weight: 700;
  color: var(--text-primary);
  margin-left: 6px;
}

.category-chip {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 100px;
  white-space: nowrap;
}

.tag-action {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 12px;
  border-radius: 100px;
  display: inline-block;
}
.tag-action.long {
  background: rgba(52, 211, 153, 0.15);
  color: var(--accent-green);
  border: 1px solid rgba(52, 211, 153, 0.3);
}
.tag-action.hold {
  background: rgba(245, 158, 11, 0.15);
  color: var(--accent-gold-light);
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.upside-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--accent-green);
  background: rgba(52, 211, 153, 0.15);
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 4px;
}

.col-rationale { max-width: 320px; }
.rationale-text {
  color: var(--text-secondary);
  font-size: 12.5px;
  line-height: 1.45;
}

.action-btn {
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid var(--border-highlight);
  color: var(--accent-gold);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  padding: 5px 14px;
  border-radius: 100px;
  cursor: pointer;
  white-space: nowrap;
  transition: var(--transition-smooth);
}
.action-btn:hover {
  background: var(--accent-gold);
  color: #000000;
}

/* Deep Dive Workspace Grid */
.deep-dive-grid {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 20px;
}

@media (max-width: 1200px) {
  .deep-dive-grid { grid-template-columns: 1fr; }
}

.advisor-focus-card, .chart-display-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  padding: 22px;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(25px) saturate(180%);
}

.price-target-widget {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 14px;
  margin-top: 12px;
}

.pt-labels {
  display: flex;
  justify-content: space-between;
  text-align: center;
  margin-bottom: 8px;
}

.pt-bar-track {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 100px;
  overflow: hidden;
}
.pt-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
}

.pt-upside-footer {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
}

.takeaway-bullet-box {
  background: rgba(255, 255, 255, 0.03);
  border-left: 3px solid var(--accent-gold);
  padding: 12px 14px;
  border-radius: 0 10px 10px 0;
  margin-top: 12px;
}

.open-modal-btn {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #000000;
  border: none;
  padding: 10px 16px;
  border-radius: 100px;
  font-family: var(--font-sans);
  font-size: 11.5px;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-smooth);
}
.open-modal-btn:hover { background: #b45309; color: #ffffff; }

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 12px;
}

.chart-canvas-container {
  width: 100%;
  height: 420px;
}

/* Modal Drawer */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(20px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-smooth);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-container {
  background: var(--bg-modal);
  border: 1px solid var(--border-subtle);
  border-radius: 20px;
  width: 100%;
  max-width: 920px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 60px rgba(0,0,0,0.9);
}

.modal-header {
  padding: 18px 28px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.close-modal-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 24px;
  cursor: pointer;
}

.modal-nav-tabs {
  display: flex;
  background: rgba(255, 255, 255, 0.03);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 28px;
  gap: 8px;
}

.modal-tab-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: var(--transition-smooth);
}
.modal-tab-btn.active {
  color: var(--accent-gold);
  border-bottom-color: var(--accent-gold);
}

.modal-body {
  padding: 28px;
  overflow-y: auto;
  flex: 1;
}

.bullet-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.bullet-list li {
  position: relative;
  padding-left: 18px;
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.6;
}
.bullet-list li::before {
  content: "•";
  position: absolute;
  left: 0;
  color: var(--accent-gold);
  font-weight: bold;
}

.key-level-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}
.key-level-table th, .key-level-table td {
  padding: 10px 14px;
  border: 1px solid var(--border-subtle);
  font-size: 12.5px;
}
.key-level-table th { background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-family: var(--font-mono); }

.terminal-footer {
  text-align: center;
  padding: 24px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  border-top: 1px solid var(--border-subtle);
}
  </style>
</head>
<body>

  <!-- Header -->
  <header class="terminal-header">
    <div class="header-brand">
      <span class="logo-badge"> TAIEX</span>
      <h1>台股投信機構精準決策終端</h1>
    </div>
    <div class="header-status-group">
      <div class="header-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">🟢 已成功連線台股市場資料庫即時更新</span>
      </div>
      <button class="manual-refresh-btn" id="manual-refresh-btn" title="即時重新整理報價">🔄 立即更新</button>
    </div>
  </header>

  <!-- Live Market Ticker Carousel -->
  <div id="ticker-carousel" class="ticker-carousel-bar">
    <!-- Dynamically populated -->
  </div>

  <!-- Main Workspace -->
  <main class="dashboard-container">

    <!-- Filter Card -->
    <div class="glass-card">
      <div class="filter-bar">
        <div class="filter-controls">
          <div class="filter-group">
            <label>產業概念:</label>
            <div id="filter-theme-btns" class="segmented-control">
              <button class="filter-btn active" data-value="all">全部 (13)</button>
              <button class="filter-btn" data-value="leo_sat">低軌衛星 (4)</button>
              <button class="filter-btn" data-value="adv_pkg">先進封裝 (3)</button>
              <button class="filter-btn" data-value="cpo_photonics">矽光子 CPO (2)</button>
              <button class="filter-btn" data-value="liquid_cooling">水冷散熱 (2)</button>
              <button class="filter-btn" data-value="ai_dpu">AI 網通 DPU (1)</button>
              <button class="filter-btn" data-value="socamm2">SOCAMM2 族群 (1)</button>
            </div>
          </div>

          <div class="filter-group">
            <label>決策:</label>
            <div id="filter-action-btns" class="segmented-control">
              <button class="filter-btn active" data-value="all">全部</button>
              <button class="filter-btn text-green" data-value="LONG">做多 LONG (12)</button>
              <button class="filter-btn text-amber" data-value="HOLD">觀望 HOLD (1)</button>
            </div>
          </div>

          <button id="filter-watchlist-btn" class="star-filter-btn">
            ⭐ 我的收藏
          </button>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="stock-search-input" class="search-input" placeholder="搜尋股票代號或名稱...">
        </div>
      </div>

      <!-- Quant Screener Sliders -->
      <div class="screener-bar">
        <div class="screener-item">
          <span>最小潛在漲幅: <b class="mono text-green" id="screener-upside-val">0%</b></span>
          <input type="range" id="screener-upside" min="0" max="30" step="1" value="0">
        </div>
        <div class="screener-item">
          <span>最高預估本益比 (P/E): <b class="mono text-amber" id="screener-pe-val">40x</b></span>
          <input type="range" id="screener-pe" min="10" max="40" step="1" value="40">
        </div>
      </div>
    </div>

    <!-- Master Executive Decision Table -->
    <div class="table-wrapper">
      <table class="master-table">
        <thead>
          <tr>
            <th style="width: 40px; text-align: center;">收藏</th>
            <th>股票標的</th>
            <th>產業概念</th>
            <th>當前股價</th>
            <th>解釋員決策</th>
            <th>建議進場點</th>
            <th>目標價 (潛在空間)</th>
            <th>停損價</th>
            <th>精準核心邏輯 (Key Rationale)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="master-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

    <!-- Deep Dive Workspace with Multi-Chart Mode Switcher -->
    <section class="deep-dive-grid">
      <div id="advisor-focus-card" class="advisor-focus-card">
        <!-- Dynamically populated -->
      </div>

      <div class="chart-display-panel">
        <div class="chart-header">
          <div class="segmented-control">
            <button class="filter-btn chart-mode-tab active" data-mode="kline">📈 30D K線與5大均線</button>
            <button class="filter-btn chart-mode-tab" data-mode="profile">📊 法人籌碼分佈</button>
            <button class="filter-btn chart-mode-tab" data-mode="radar">🎯 5維度能力雷達</button>
            <button class="filter-btn chart-mode-tab" data-mode="oscillator">📉 技術指標 (RSI/MACD/KD)</button>
          </div>
