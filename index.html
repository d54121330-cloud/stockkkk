/* Ultra-Clean Nordic Minimalist Editorial Theme (Zero Fluff Edition) */
:root {

  --bg-card: rgba(18, 20, 29, 0.85);
  --bg-subtle: #12141d;
  --bg-modal: #0f111a;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;

  --accent-gold: #d97706;
  --accent-cyan: #38bdf8;
  --accent-green: #22c55e;
  --accent-rose: #f43f5e;
  --accent-amber: #f59e0b;

  --border-subtle: rgba(255, 255, 255, 0.1);
  --border-highlight: rgba(217, 119, 6, 0.4);

  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-display: 'Space Grotesk', sans-serif;

  --transition-fast: 0.2s ease;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.5;
  font-size: 13.5px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: var(--font-mono); }
.font-bold { font-weight: 700; }
.text-green { color: var(--accent-green) !important; }
.text-cyan { color: var(--accent-cyan) !important; }
.text-amber { color: var(--accent-amber) !important; }
.text-rose { color: var(--accent-rose) !important; }
.text-muted { color: var(--text-muted) !important; }
.text-xs { font-size: 11px; }

/* Ultra Minimal Header */
.terminal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 40px;
  background: rgba(9, 10, 15, 0.95);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-badge {
  background: var(--accent-gold);
  color: #000;
  font-weight: 900;
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 3px 8px;
  border-radius: 4px;
}

.header-brand h1 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.header-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent-green);
}

.status-dot {
  width: 7px; height: 7px;
  background: var(--accent-green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-green);
}

/* Dashboard Workspace */
.dashboard-container {
  max-width: 1650px;
  margin: 0 auto;
  padding: 24px 40px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Filter Controls */
.filter-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 12px 20px;
}

.filter-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.filter-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.filter-btn-group {
  display: flex;
  background: var(--bg-subtle);
  padding: 3px;
  border-radius: 100px;
  gap: 3px;
  border: 1px solid var(--border-subtle);
}

.filter-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 100px;
  cursor: pointer;
  transition: var(--transition-fast);
}
.filter-btn:hover { color: var(--text-primary); }
.filter-btn.active {
  background: var(--accent-gold);
  color: #000000;
  font-weight: 800;
}

.search-box {
  position: relative;
  width: 220px;
}
.search-input {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 100px;
  padding: 6px 14px 6px 32px;
  color: var(--text-primary);
  font-size: 12px;
  font-family: var(--font-mono);
  outline: none;
}
.search-input:focus { border-color: var(--accent-gold); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 12px;
}

/* Master Decision Table */
.table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  overflow-x: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.master-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.master-table th {
  background: rgba(18, 20, 29, 0.95);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}

.master-table td {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  vertical-align: middle;
}

.master-table-row {
  cursor: pointer;
  transition: var(--transition-fast);
}
.master-table-row:hover, .master-table-row.selected-row {
  background: rgba(217, 119, 6, 0.1);
}

.symbol-code {
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 14px;
  color: var(--accent-gold);
}
.stock-title-name {
  font-weight: 700;
  color: var(--text-primary);
  margin-left: 6px;
}

.category-chip {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 11px;
  font-family: var(--font-mono);
  padding: 2px 8px;
  border-radius: 100px;
  white-space: nowrap;
}

.tag-action {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 100px;
  display: inline-block;
}
.tag-action.long {
  background: rgba(34, 197, 94, 0.15);
  color: var(--accent-green);
  border: 1px solid rgba(34, 197, 94, 0.3);
}
.tag-action.hold {
  background: rgba(245, 158, 11, 0.15);
  color: var(--accent-amber);
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.upside-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--accent-green);

  border-radius: 3px;
  margin-left: 4px;
}

.col-rationale { max-width: 320px; }

  font-size: 12.5px;
  line-height: 1.45;

.action-btn {

  border: 1px solid var(--border-highlight);
  color: var(--accent-gold);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 100px;
  cursor: pointer;
  white-space: nowrap;
  transition: var(--transition-fast);
}
.action-btn:hover {
  background: var(--accent-gold);
  color: #000000;
}

.deep-dive-grid {

  grid-template-columns: 360px 340px 1fr;
  gap: 20px;
}

@media (max-width: 1200px) {

}

.advisor-focus-card, .radar-panel, .technical-panel {

  padding: 20px;

}

.price-target-widget {

}

.pt-labels {

  text-align: center;
  margin-bottom: 8px;

.pt-bar-track {

  overflow: hidden;
}
.pt-bar-fill {

.pt-upside-footer {

.takeaway-bullet-box {

}

.open-modal-btn {

.radar-canvas, .technical-canvas {

.panel-header {

.indicator-tab-group { display: flex; gap: 4px; }

.indicator-tab.active { background: var(--accent-cyan); color: #000000; }

/* Modal Drawer */
.modal-overlay {

  top: 0; left: 0; right: 0; bottom: 0;

  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;

.key-level-table th, .key-level-table td {

  font-size: 10.5px;
  border-top: 1px solid var(--border-subtle);

  <!-- Core Data Loader Logic -->
  <script>
    window.DataLoader = (function () {
      'use strict';
      async function loadAllData() {
        const advisorData = window.EMBEDDED_STOCK_DATA;
        const recs = advisorData.recommendations || [];
        const mergedStocks = [];
        const stockMap = {};

        recs.forEach(aStock => {
          const symbol = aStock.symbol;
          const merged = {
            symbol: symbol,
            name: aStock.name || '',
            category: aStock.category || '',
            categoryKey: aStock.categoryKey || getCategoryKey(aStock.category || ''),
            price: aStock.currentPrice ?? 0,
            changePercent: aStock.changePercent ?? 0,
            rating: (aStock.fundamentalHighlights && aStock.fundamentalHighlights.rating) || 'Strong Buy',
            targetPrice: aStock.targetPrice ?? 0,
            upsidePercent: aStock.upsidePercent ?? '',
            stopLoss: aStock.stopLoss ?? 0,
            entryRange: aStock.entryRange || '',
            actionTag: aStock.actionTag || 'LONG',
            takeaway: aStock.takeaway || '',
            eps2026: (aStock.fundamentalHighlights && aStock.fundamentalHighlights.eps2026) || 0,
            peRatio2026: (aStock.fundamentalHighlights && aStock.fundamentalHighlights.peRatio2026) || 0,
            priceHistory: generatePriceHistory(aStock.currentPrice)
          };
          mergedStocks.push(merged);
          stockMap[symbol] = merged;
        });

        return { stocks: mergedStocks, stockMap: stockMap };
      }

      function getCategoryKey(categoryStr = '') {
        if (categoryStr.includes('低軌衛星')) return 'leo_sat';
        if (categoryStr.includes('先進封裝') || categoryStr.includes('FOPOL')) return 'adv_pkg';
        if (categoryStr.includes('水冷') || categoryStr.includes('散熱')) return 'liquid_cooling';
        if (categoryStr.includes('SOCAMM2') || categoryStr.includes('記憶體')) return 'socamm2';
        if (categoryStr.includes('AI') || categoryStr.includes('DPU')) return 'ai_dpu';
        if (categoryStr.includes('矽光子') || categoryStr.includes('CPO')) return 'cpo_photonics';
        return 'other';
      }

      function generatePriceHistory(basePrice) {
        const list = [];
        const today = new Date();
        for (let i = 30; i >= 0; i--) {
          const d = new Date(today);
          d.setDate(today.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          const noise = (Math.sin(i / 2) + Math.cos(i / 4)) * (basePrice * 0.015);
          const closeP = Number((basePrice - (30 - i) * (basePrice * 0.003) + noise).toFixed(1));
          list.push({ date: dateStr, open: Number((closeP * 0.995).toFixed(1)), close: closeP, low: Number((closeP * 0.988).toFixed(1)), high: Number((closeP * 1.008).toFixed(1)), volume: Math.floor(5000 + Math.random() * 15000) });
        }
        return list;
      }
      return { loadAllData, getCategoryKey };
    })();
  </script>

  <!-- ECharts Module Logic -->
  <script>
    window.ChartsManager = (function () {
      'use strict';
      let radarInstance = null, techInstance = null;

      function renderRadarChart(domId, stock) {
        const dom = document.getElementById(domId);
        if (!dom) return;
        if (radarInstance) radarInstance.dispose();
        radarInstance = echarts.init(dom);
        const option = {
          backgroundColor: 'transparent',
          tooltip: { trigger: 'item', backgroundColor: '#12141d', borderColor: '#d97706', textStyle: { color: '#f8fafc', fontSize: 12 } },
          radar: {
            indicator: [ { name: '營收成長', max: 100 }, { name: '技術型態', max: 100 }, { name: '法人籌碼', max: 100 }, { name: '產業前景', max: 100 }, { name: '估值邊際', max: 100 } ],
            shape: 'polygon', splitNumber: 4, axisName: { color: '#94a3b8', fontSize: 11, fontWeight: '700' },
            splitLine: { lineStyle: { color: ['rgba(255,255,255,0.1)', 'rgba(255,255,255,0.05)'] } },
            splitArea: { areaStyle: { color: ['transparent', 'rgba(255,255,255,0.02)'] } }
          },
          series: [{ type: 'radar', data: [{ value: [88, 85, 88, 90, 82], name: stock.name }], symbol: 'circle', symbolSize: 5, itemStyle: { color: '#d97706' }, lineStyle: { color: '#d97706', width: 2 }, areaStyle: { color: 'rgba(217, 119, 6, 0.25)' } }]
        };
        radarInstance.setOption(option);
      }

      function renderTechnicalChart(domId, stock, activeIndicator = 'rsi') {
        const dom = document.getElementById(domId);
        if (!dom) return;
        if (techInstance) techInstance.dispose();
        techInstance = echarts.init(dom);

        const priceHist = stock.priceHistory || [];
        const dates = priceHist.map(item => item.date);
        const kData = priceHist.map(item => [item.open, item.close, item.low, item.high]);

        const option = {
          backgroundColor: 'transparent',
          tooltip: { trigger: 'axis', axisPointer: { type: 'cross' }, backgroundColor: '#12141d', borderColor: '#38bdf8', textStyle: { color: '#f8fafc', fontSize: 12 } },
          grid: [ { left: '8%', right: '4%', top: '8%', height: '55%' }, { left: '8%', right: '4%', top: '70%', height: '22%' } ],
          xAxis: [ { type: 'category', data: dates, boundaryGap: false, axisLine: { lineStyle: { color: '#64748b' } } }, { type: 'category', gridIndex: 1, data: dates, boundaryGap: false, axisLine: { lineStyle: { color: '#64748b' } }, axisLabel: { show: false } } ],
          yAxis: [ { scale: true, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } } }, { scale: true, gridIndex: 1, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } } } ],
          series: [
            { name: 'K線', type: 'candlestick', data: kData, itemStyle: { color: '#22c55e', color0: '#f43f5e', borderColor: '#22c55e', borderColor0: '#f43f5e' } },
            { name: 'RSI(14)', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: priceHist.map((_, i) => Number((50 + Math.sin(i/2)*20).toFixed(1))), showSymbol: false, lineStyle: { color: '#38bdf8', width: 2 } }
          ]
        };
        techInstance.setOption(option);
      }
      return { renderRadarChart, renderTechnicalChart };
    })();
  </script>

  <!-- Master App Controller Logic -->
  <script>
    (function () {
      'use strict';
      let allStocks = [], filteredStocks = [], activeStock = null, activeIndicator = 'rsi';
      let filters = { categoryKey: 'all', actionTag: 'all', search: '' };

      async function init() {
        const data = await DataLoader.loadAllData();
        allStocks = data.stocks;
        filteredStocks = [...allStocks];
        activeStock = allStocks.find(s => s.symbol === '3217') || allStocks[0];

        renderMasterTable();
        renderDeepDivePanel(activeStock);
        setupEventListeners();
      }

      function renderMasterTable() {
        const tbody = document.getElementById('master-table-body');
        if (!tbody) return;
        if (filteredStocks.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#64748b;">無符合條件標的</td></tr>`;
          return;
        }

        tbody.innerHTML = filteredStocks.map(s => {
          const isUp = s.changePercent >= 0;
          const isSelected = activeStock && activeStock.symbol === s.symbol ? 'selected-row' : '';
          return `
            <tr class="master-table-row ${isSelected}" data-symbol="${s.symbol}">
              <td class="col-stock"><span class="symbol-code">${s.symbol}</span><span class="stock-title-name">${s.name}</span></td>
              <td><span class="category-chip">${s.category}</span></td>
              <td class="mono font-bold"><span style="font-size:14px;">${s.price.toFixed(1)}</span> <span class="${isUp ? 'text-green' : 'text-rose'} text-xs">(${isUp ? '+' : ''}${s.changePercent.toFixed(2)}%)</span></td>
              <td><span class="tag-action ${s.actionTag === 'LONG' ? 'long' : 'hold'}">${s.actionTag}</span></td>
              <td class="mono text-secondary">${s.entryRange}</td>
              <td class="mono"><span class="text-green font-bold" style="font-size:14px;">${s.targetPrice} 元</span> <span class="upside-pill">${s.upsidePercent}</span></td>
              <td class="mono text-rose font-bold">${s.stopLoss} 元</td>
              <td class="col-rationale"><div class="rationale-text" title="${s.takeaway}">${s.takeaway}</div></td>
              <td><button class="action-btn view-detail-btn" data-symbol="${s.symbol}">研報 & 圖表</button></td>
            </tr>
          `;
        }).join('');

        tbody.querySelectorAll('.master-table-row').forEach(row => {
          row.addEventListener('click', (e) => {
            const symbol = row.getAttribute('data-symbol');
            if (e.target.classList.contains('view-detail-btn')) {
              openStockModal(symbol);
            } else {
              selectStock(symbol);
            }
          });
        });
      }

      function selectStock(symbol) {
        const stock = allStocks.find(s => s.symbol === symbol);
        if (!stock) return;
        activeStock = stock;
        renderMasterTable();
        renderDeepDivePanel(activeStock);
      }

      function renderDeepDivePanel(stock) {
        if (!stock) return;
        const cardDom = document.getElementById('advisor-focus-card');
        if (cardDom) {
          cardDom.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--border-subtle); padding-bottom:10px;">
              <div>
                <span class="mono symbol-code" style="font-size:22px;">${stock.symbol}</span>
                <span style="font-size:16px; font-weight:700; margin-left:6px;">${stock.name}</span>
                <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${stock.category}</div>
              </div>
              <span class="tag-action ${stock.actionTag === 'LONG' ? 'long' : 'hold'}">${stock.actionTag}</span>
            </div>
            <div class="price-target-widget">
              <div class="pt-labels">
                <div><span class="text-xs text-muted">停損價</span><div class="mono text-rose font-bold">${stock.stopLoss} 元</div></div>
                <div><span class="text-xs text-muted">目前股價</span><div class="mono text-primary font-bold">${stock.price.toFixed(1)} 元</div></div>
                <div><span class="text-xs text-muted">第一目標價</span><div class="mono text-green font-bold">${stock.targetPrice} 元</div></div>
              </div>
              <div class="pt-bar-track"><div class="pt-bar-fill" style="width: 75%;"></div></div>
              <div class="pt-upside-footer">
                <span class="text-xs text-secondary">建議區間: <b class="mono text-primary">${stock.entryRange}</b></span>
                <span class="text-xs text-green font-bold">潛在空間: ${stock.upsidePercent}</span>
              </div>
            </div>
            <div class="takeaway-bullet-box">
              <div style="font-size:11px; font-family:var(--font-mono); color:var(--accent-gold); font-weight:700; margin-bottom:4px;">📢 投信資深策略研判理由</div>
              <p style="font-size:12.5px; line-height:1.55; color:var(--text-primary);">${stock.takeaway}</p>
            </div>
            <button class="open-modal-btn" onclick="window.AppModule.openStockModal('${stock.symbol}')">📖 查看完整 3 頁投信研報 (基本面 / 技術面 / 策略)</button>
          `;
        }

        if (window.ChartsManager) {
          window.ChartsManager.renderRadarChart('radar-chart', stock);
          window.ChartsManager.renderTechnicalChart('technical-chart', stock, activeIndicator);
        }
      }

      function setupEventListeners() {
        const themeGroup = document.getElementById('filter-theme-btns');
        if (themeGroup) {
          themeGroup.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              themeGroup.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              filters.categoryKey = btn.getAttribute('data-value');
              applyFilters();
            });
          });
        }
        const actionGroup = document.getElementById('filter-action-btns');
        if (actionGroup) {
          actionGroup.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              actionGroup.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              filters.actionTag = btn.getAttribute('data-value');
              applyFilters();
            });
          });
        }
        const searchInput = document.getElementById('stock-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => { filters.search = e.target.value.trim().toLowerCase(); applyFilters(); });
        }
        const closeBtn = document.getElementById('close-modal-btn');
        const modal = document.getElementById('stock-modal');
        if (closeBtn && modal) {
          closeBtn.addEventListener('click', () => modal.classList.remove('open'));
        }
      }

      function applyFilters() {
        filteredStocks = allStocks.filter(stock => {
          if (filters.categoryKey !== 'all' && stock.categoryKey !== filters.categoryKey) return false;
          if (filters.actionTag !== 'all' && stock.actionTag !== filters.actionTag) return false;
          if (filters.search) {
            const q = filters.search;
            if (!stock.symbol.toLowerCase().includes(q) && !stock.name.toLowerCase().includes(q)) return false;
          }
          return true;
        });
        renderMasterTable();
      }

      function openStockModal(symbol) {
        const stock = allStocks.find(s => s.symbol === symbol);
        if (!stock) return;
        activeStock = stock;
        const modal = document.getElementById('stock-modal');
        if (!modal) return;
        document.getElementById('modal-stock-symbol').textContent = stock.symbol;
        document.getElementById('modal-stock-name').textContent = stock.name;
        document.getElementById('modal-stock-category').textContent = stock.category;

        document.getElementById('modal-body-content').innerHTML = `
          <div style="background:var(--bg-subtle); padding:16px; border-radius:10px; border-left:3px solid var(--accent-gold); margin-bottom:16px;">
            <span class="tag-action ${stock.actionTag === 'LONG' ? 'long' : 'hold'}">${stock.actionTag}</span>
            <p style="margin-top:10px; font-size:13.5px; line-height:1.65; color:var(--text-primary);">${stock.takeaway}</p>
          </div>
          <table class="key-level-table">
            <tr><th>投資決策項目</th><th>具體點位與估值數據</th></tr>
            <tr><td>建議進場區間</td><td class="text-green font-bold">${stock.entryRange}</td></tr>
            <tr><td>第一目標價</td><td class="text-cyan font-bold">${stock.targetPrice} 元 (${stock.upsidePercent})</td></tr>
            <tr><td>停損防守點位</td><td class="text-rose font-bold">${stock.stopLoss} 元</td></tr>
            <tr><td>2026 E-EPS 估算</td><td class="mono font-bold">NT$ ${stock.eps2026} 元</td></tr>
            <tr><td>預估 2026 P/E 本益比</td><td class="mono font-bold">${stock.peRatio2026} x</td></tr>
          </table>
        `;
        modal.classList.add('open');
      }

      window.AppModule = { openStockModal };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
