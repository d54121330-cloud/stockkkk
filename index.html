<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股投信機構精準決策終端 | Institutional Analytics</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- ECharts 5.x CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
/* Nordic Dark Editorial Theme */
:root {
  --bg-dark: #090a0f;
  --bg-card: rgba(18, 20, 29, 0.85);
  --bg-subtle: #12141d;
  --bg-modal: #0f111a;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;

  --accent-gold: #d97706;
  --accent-cyan: #38bdf8;
  --accent-green: #22c55e;
  --accent-rose: #f43f5e;
  --accent-amber: #f59e0b;
  --accent-purple: #a855f7;

  --border-subtle: rgba(255, 255, 255, 0.1);
  --border-highlight: rgba(217, 119, 6, 0.4);

  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-display: 'Space Grotesk', sans-serif;

  --transition-fast: 0.2s ease;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.5;
  font-size: 13.5px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: var(--font-mono); }
.font-bold { font-weight: 700; }
.text-green { color: var(--accent-green) !important; }
.text-cyan { color: var(--accent-cyan) !important; }
.text-amber { color: var(--accent-amber) !important; }
.text-rose { color: var(--accent-rose) !important; }
.text-muted { color: var(--text-muted) !important; }
.text-xs { font-size: 11px; }

/* Header with Live Sync Status */
.terminal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 40px;
  background: rgba(9, 10, 15, 0.95);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-badge {
  background: var(--accent-gold);
  color: #000;
  font-weight: 900;
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 3px 8px;
  border-radius: 4px;
}

.header-brand h1 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.header-status-group {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent-green);
  background: rgba(34, 197, 94, 0.1);
  padding: 5px 14px;
  border-radius: 100px;
  border: 1px solid rgba(34, 197, 94, 0.2);
}

.status-dot {
  width: 7px; height: 7px;
  background: var(--accent-green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-green);
}
.status-dot.syncing {
  background: var(--accent-amber);
  box-shadow: 0 0 8px var(--accent-amber);
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  from { opacity: 0.4; }
  to { opacity: 1; }
}

.manual-refresh-btn {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 100px;
  cursor: pointer;
  transition: var(--transition-fast);
}
.manual-refresh-btn:hover {
  background: var(--accent-gold);
  color: #000;
  font-weight: bold;
}

/* Dashboard Workspace */
.dashboard-container {
  max-width: 1650px;
  margin: 0 auto;
  padding: 24px 40px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Filter Controls */
.filter-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 12px 20px;
}

.filter-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.filter-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.filter-group label {
  color: var(--text-muted);
  font-weight: 600;
  font-family: var(--font-mono);
}

.filter-btn-group {
  display: flex;
  background: var(--bg-subtle);
  padding: 3px;
  border-radius: 100px;
  gap: 3px;
  border: 1px solid var(--border-subtle);
}

.filter-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 100px;
  cursor: pointer;
  transition: var(--transition-fast);
}
.filter-btn:hover { color: var(--text-primary); }
.filter-btn.active {
  background: var(--accent-gold);
  color: #000000;
  font-weight: 800;
}

.search-box {
  position: relative;
  width: 240px;
}
.search-input {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 100px;
  padding: 6px 14px 6px 32px;
  color: var(--text-primary);
  font-size: 12px;
  font-family: var(--font-mono);
  outline: none;
}
.search-input:focus { border-color: var(--accent-gold); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 12px;
}

/* Master Decision Table */
.table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  overflow-x: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.master-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.master-table th {
  background: rgba(18, 20, 29, 0.95);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}

.master-table td {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  vertical-align: middle;
}

.master-table-row {
  cursor: pointer;
  transition: var(--transition-fast);
}
.master-table-row:hover, .master-table-row.selected-row {
  background: rgba(217, 119, 6, 0.12);
}

.symbol-code {
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 14px;
  color: var(--accent-gold);
}
.stock-title-name {
  font-weight: 700;
  color: var(--text-primary);
  margin-left: 6px;
}

.category-chip {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 11px;
  font-family: var(--font-mono);
  padding: 2px 8px;
  border-radius: 100px;
  white-space: nowrap;
}

.tag-action {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 100px;
  display: inline-block;
}
.tag-action.long {
  background: rgba(34, 197, 94, 0.15);
  color: var(--accent-green);
  border: 1px solid rgba(34, 197, 94, 0.3);
}
.tag-action.hold {
  background: rgba(245, 158, 11, 0.15);
  color: var(--accent-amber);
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.upside-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--accent-green);
  background: rgba(34, 197, 94, 0.15);
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
}

.col-rationale { max-width: 320px; }
.rationale-text {
  color: var(--text-secondary);
  font-size: 12.5px;
  line-height: 1.45;
}

.action-btn {
  background: rgba(217, 119, 6, 0.15);
  border: 1px solid var(--border-highlight);
  color: var(--accent-gold);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 100px;
  cursor: pointer;
  white-space: nowrap;
  transition: var(--transition-fast);
}
.action-btn:hover {
  background: var(--accent-gold);
  color: #000000;
}

/* Deep Dive Workspace */
.deep-dive-grid {
  display: grid;
  grid-template-columns: 340px 340px 1fr;
  gap: 20px;
}

@media (max-width: 1300px) {
  .deep-dive-grid { grid-template-columns: 1fr; }
}

.advisor-focus-card, .radar-panel, .technical-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.price-target-widget {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 14px;
  margin-top: 12px;
}

.pt-labels {
  display: flex;
  justify-content: space-between;
  text-align: center;
  margin-bottom: 8px;
}

.pt-bar-track {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 100px;
  overflow: hidden;
}
.pt-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
}

.pt-upside-footer {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
}

.takeaway-bullet-box {
  background: var(--bg-subtle);
  border-left: 3px solid var(--accent-gold);
  padding: 12px 14px;
  border-radius: 0 8px 8px 0;
  margin-top: 12px;
}

.open-modal-btn {
  width: 100%;
  background: var(--accent-gold);
  color: #000000;
  border: none;
  padding: 10px;
  border-radius: 100px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 14px;
  transition: var(--transition-fast);
}
.open-modal-btn:hover { background: #b45309; color: #ffffff; }

.radar-canvas {
  width: 100%;
  height: 320px;
}

.technical-canvas {
  width: 100%;
  height: 320px;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 8px;
}
.panel-header h3 { font-size: 13px; font-weight: 700; }

.ma-legend-bar {
  display: flex;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.ma-tag {
  display: flex;
  align-items: center;
  gap: 4px;
}
.ma-dot { width: 8px; height: 3px; border-radius: 2px; }

/* Modal Drawer with Tabs */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(12px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-fast);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-container {
  background: var(--bg-modal);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  width: 100%;
  max-width: 900px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 50px rgba(0,0,0,0.8);
}

.modal-header {
  padding: 16px 28px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.close-modal-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 24px;
  cursor: pointer;
}

.modal-nav-tabs {
  display: flex;
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 28px;
  gap: 8px;
}

.modal-tab-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: var(--transition-fast);
}
.modal-tab-btn.active {
  color: var(--accent-gold);
  border-bottom-color: var(--accent-gold);
}

.modal-body {
  padding: 28px;
  overflow-y: auto;
  flex: 1;
}

.modal-section-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--accent-gold);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.bullet-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.bullet-list li {
  position: relative;
  padding-left: 18px;
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.6;
}
.bullet-list li::before {
  content: "•";
  position: absolute;
  left: 0;
  color: var(--accent-gold);
  font-weight: bold;
}

.key-level-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}
.key-level-table th, .key-level-table td {
  padding: 8px 12px;
  border: 1px solid var(--border-subtle);
  font-size: 12.5px;
}
.key-level-table th { background: var(--bg-subtle); color: var(--text-muted); font-family: var(--font-mono); }

.terminal-footer {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 10.5px;
  border-top: 1px solid var(--border-subtle);
}
  </style>
</head>
<body>

  <!-- Header -->
  <header class="terminal-header">
    <div class="header-brand">
      <span class="logo-badge">TAIEX</span>
      <h1>台股投信機構精準決策終端</h1>
    </div>
    <div class="header-status-group">
      <div class="header-status" id="live-status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">🟢 已成功連線台股市場資料庫即時更新</span>
      </div>
      <button class="manual-refresh-btn" id="manual-refresh-btn" title="即時重新整理報價">🔄 立即更新</button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="dashboard-container">

    <!-- Filter Bar -->
    <div class="filter-card">
      <div class="filter-bar">
        <div class="filter-controls">
          <div class="filter-group">
            <label>產業概念:</label>
            <div id="filter-theme-btns" class="filter-btn-group">
              <button class="filter-btn active" data-value="all">全部 (13)</button>
              <button class="filter-btn" data-value="leo_sat">低軌衛星 (4)</button>
              <button class="filter-btn" data-value="adv_pkg">先進封裝 (3)</button>
              <button class="filter-btn" data-value="cpo_photonics">矽光子 CPO (2)</button>
              <button class="filter-btn" data-value="liquid_cooling">水冷散熱 (2)</button>
              <button class="filter-btn" data-value="ai_dpu">AI 網通 DPU (1)</button>
              <button class="filter-btn" data-value="socamm2">SOCAMM2 族群 (1)</button>
            </div>
          </div>

          <div class="filter-group">
            <label>決策:</label>
            <div id="filter-action-btns" class="filter-btn-group">
              <button class="filter-btn active" data-value="all">全部</button>
              <button class="filter-btn text-green" data-value="LONG">做多 LONG (12)</button>
              <button class="filter-btn text-amber" data-value="HOLD">觀望 HOLD (1)</button>
            </div>
          </div>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="stock-search-input" class="search-input" placeholder="搜尋股票代號或名稱...">
        </div>
      </div>
    </div>

    <!-- Master Executive Decision Table -->
    <div class="table-wrapper">
      <table class="master-table">
        <thead>
          <tr>
            <th>股票標的</th>
            <th>產業概念</th>
            <th>當前股價</th>
            <th>解釋員決策</th>
            <th>建議進場點</th>
            <th>目標價 (潛在空間)</th>
            <th>停損價</th>
            <th>精準核心邏輯 (Key Rationale)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="master-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

    <!-- Deep Dive Workspace with 30D Candlestick & 5 MA Lines -->
    <section class="deep-dive-grid">
      <div id="advisor-focus-card" class="advisor-focus-card">
        <!-- Dynamically populated -->
      </div>

      <div class="radar-panel">
        <div class="panel-header">
          <h3>投信 5 維度能力評級</h3>
        </div>
        <div id="radar-chart" class="radar-canvas"></div>
      </div>

      <div class="technical-panel">
        <div class="panel-header">
          <div>
            <h3>近 30 日 K 線與 5 大均線 (MA5/10/20/30/50)</h3>
            <div class="ma-legend-bar">
              <span class="ma-tag"><span class="ma-dot" style="background:#f59e0b;"></span>MA5</span>
              <span class="ma-tag"><span class="ma-dot" style="background:#38bdf8;"></span>MA10</span>
              <span class="ma-tag"><span class="ma-dot" style="background:#22c55e;"></span>MA20</span>
              <span class="ma-tag"><span class="ma-dot" style="background:#a855f7;"></span>MA30</span>
              <span class="ma-tag"><span class="ma-dot" style="background:#d97706;"></span>MA50</span>
            </div>
          </div>
        </div>
        <div id="technical-chart" class="technical-canvas"></div>
      </div>
    </section>

  </main>

  <!-- Research Modal Drawer -->
  <div id="stock-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title-group" style="display: flex; align-items: center; gap: 10px;">
          <span id="modal-stock-symbol" class="mono text-cyan" style="font-size: 20px; font-weight: 800;">3217</span>
          <span id="modal-stock-name" style="font-size: 16px; font-weight: 700;">優群</span>
          <span id="modal-stock-category" class="category-chip">SOCAMM2 次世代記憶體</span>
        </div>
        <button id="close-modal-btn" class="close-modal-btn">&times;</button>
      </div>

      <div class="modal-nav-tabs">
        <button class="modal-tab-btn active" data-tab="advisor">📢 策略解釋員與點位</button>
        <button class="modal-tab-btn" data-tab="fundamental">📈 基本面深度研報</button>
        <button class="modal-tab-btn" data-tab="technical">📊 技術面 30D K線與 5 大均線</button>
      </div>

      <div id="modal-body-content" class="modal-body">
        <!-- Dynamically populated per tab -->
      </div>
    </div>
  </div>

  <footer class="terminal-footer">
    <p>Taiwan Stock Institutional Investor Research Terminal — Live Auto-Sync Edition</p>
  </footer>

  <!-- Data & Application Scripts -->
  <script src="data/stock_database.js"></script>
  <script src="js/data_loader.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
